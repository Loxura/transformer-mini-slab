# kitty "e-ink" colourscheme — paper & ink, mostly grayscale, one ink-blue accent.
# include this from kitty.conf:  include themes/kitty-eink.conf
# Starter/draft — tune on the actual panel.

foreground            #1B1B1B
background            #F4F1EA
cursor                #1B1B1B
cursor_text_color     #F4F1EA
selection_foreground  #1B1B1B
selection_background  #B7B3A9
url_color             #45577A

# no motion vibe: keep it flat
cursor_blink_interval 0
background_opacity     1.0

# 16-colour ANSI ramp (light background → dark inks + grays, one blue accent)
# normal
color0  #1B1B1B
color1  #6E6E6E
color2  #4A4A4A
color3  #8A8A8A
color4  #45577A
color5  #5A5A5A
color6  #5E6B6B
color7  #2A2A2A
# bright
color8  #3A3A3A
color9  #7E7E7E
color10 #5A5A5A
color11 #9A9A9A
color12 #55678A
color13 #6A6A6A
color14 #6E7B7B
color15 #1B1B1B
