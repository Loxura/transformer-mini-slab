# transformer-mini-slab — Hyprland "swipe deck"  (starter / draft)
# Modes = workspaces: 1 Dash (home) · 2 Now Playing · 3 Video
# Lean e-ink baseline (animations/blur OFF) — safe on Cherry Trail; dial up after benchmarking.
# Items marked TODO need real values from the device (hyprctl monitors / hyprctl devices).

###################### DISPLAY ######################
# Rotate the portrait-native panel to landscape.
#   transform 1 = 90°, 3 = 270°. Try both; keep the one that lands you in landscape.
# Empty name = applies to the only monitor. Set the real name once known.
monitor = , preferred, auto, 1, transform, 3   # TODO: confirm output name + transform

###################### TOUCH ######################
# Input must rotate to match the screen or taps land in the wrong place.
device {
    name = TODO-touchscreen-name               # TODO: from `hyprctl devices`
    transform = 3                              # match the monitor transform above
}

###################### GESTURES (swipe between modes) ######################
gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 250
    workspace_swipe_forever = true
    # touchscreen swipe — verify the exact key for your Hyprland version:
    # workspace_swipe_touch = true
}

###################### E-INK BASELINE (fast + calm) ######################
animations { enabled = false }
decoration {
    rounding = 0
    blur { enabled = false }
    drop_shadow = false
}
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border   = rgb(1B1B1B)
    col.inactive_border = rgb(B7B3A9)
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true                                  # variable refresh = less GPU when idle
}

###################### MODES (one fullscreen app per workspace) ######################
# 1) Dash (home) — eww widgets   (TODO: add eww config; fallback = btop)
exec-once = [workspace 1 silent] eww open dashboard
# fallback until eww is set up:
# exec-once = [workspace 1 silent] kitty --class dash -e btop

# 2) Now Playing — music client (cava heartbeat can join as a second tile later)
exec-once = [workspace 2 silent] kitty --class music -e rmpc

# 3) Video — reserved for mpv, opened on demand (e.g. a yt-dlp/file launcher script)
#    mpv --hwdec=auto <url|file>

windowrulev2 = fullscreen, class:^(dash)$
windowrulev2 = fullscreen, class:^(music)$

###################### KEYBOARD (when attached) ######################
$mod = ALT
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, K, exec, pkill wvkbd-mobintl || wvkbd-mobintl -L 280   # toggle on-screen kbd

###################### AUTOSTART ######################
exec-once = waybar          # thin top bar: workspace dots + clock  (TODO: config)
# exec-once = mpd           # only if mpd isn't a systemd service
