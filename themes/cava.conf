# ~/.config/cava/config — the "heartbeat": a monochrome spectrum on paper.
# Starter/draft.

[general]
framerate = 60
autosens = 1
# bars = 0 lets cava auto-fit the width
bars = 0

[input]
method = pipewire
source = auto

[output]
method = ncurses
channels = mono

[color]
background = '#F4F1EA'
foreground = '#1B1B1B'
# paper → ink gradient so the bars read like pressed ink
gradient = 1
gradient_count = 4
gradient_color_1 = '#B7B3A9'
gradient_color_2 = '#6E6E6E'
gradient_color_3 = '#3A3A3A'
gradient_color_4 = '#1B1B1B'

[smoothing]
noise_reduction = 0.40
