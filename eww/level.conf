# Single-bar cava config = a smoothed overall-loudness meter (0-100) for the
# "breathing" cover glow. One value per frame, NOT a 14-bar spectrum, so the
# data path is ~10x lighter than the old visualizer. cava's own smoothing gives
# a gentle envelope; the cover's CSS transition tweens between frames.
[general]
mode = normal
framerate = 30
bars = 1
autosens = 1
overshoot = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono
mono_option = average
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 0.30
