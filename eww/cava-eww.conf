# cava config for the deck card: capture the default PipeWire sink monitor and emit
# raw ASCII bar heights (0-100) to stdout, one frame per line, bars separated by ';'.
# The eww `cava` deflisten turns each line into a JSON array of bar heights.
[general]
mode = normal
framerate = 20
bars = 14
autosens = 1
overshoot = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 0.45
