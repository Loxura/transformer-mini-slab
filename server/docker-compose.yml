# transformer-mini-slab — music fetcher (runs on the MAIN PC as a transient conveyor).
# PC only holds in-flight data; sync-to-tablet.sh ships finished albums to the tablet
# and flushes the local staging. Run on-demand or leave up (it's only busy when fetching).
#
#   downloads/  = qBittorrent temp (transient)
#   library/    = Lidarr's organised output = staging that gets shipped + flushed
# Configure the UIs from a browser: Lidarr :8686 · Prowlarr :9696 · qBittorrent :8080
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: { PUID: "1000", PGID: "1000", TZ: "America/Winnipeg" }
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment: { PUID: "1000", PGID: "1000", TZ: "America/Winnipeg", WEBUI_PORT: "8080" }
    volumes:
      - ./config/qbittorrent:/config
      - ./downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment: { PUID: "1000", PGID: "1000", TZ: "America/Winnipeg" }
    volumes:
      - ./config/lidarr:/config
      - ./library:/music        # Lidarr root folder = staging (shipped + flushed)
      - ./downloads:/downloads  # must match qBittorrent's path
    ports:
      - "8686:8686"
    restart: unless-stopped
