# transformer-mini-slab — music fetcher (PC conveyor) with qBittorrent behind Mullvad WireGuard.
# gluetun = VPN with kill-switch; qBittorrent shares its network namespace, so torrent traffic
# can ONLY exit through Mullvad — if the tunnel drops, qBit is cut off (no IP leak).
# Secrets live in server/.env (gitignored). Copy .env.example -> .env and fill it in.
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: "${WIREGUARD_PRIVATE_KEY}"
      WIREGUARD_ADDRESSES: "${WIREGUARD_ADDRESSES}"
      SERVER_COUNTRIES: "${VPN_COUNTRY:-Canada}"
      FIREWALL_OUTBOUND_SUBNETS: "172.16.0.0/12"   # let Lidarr/soularr reach qBit + slskd via gluetun
      TZ: "America/Winnipeg"
    ports:
      - "8080:8080"          # qBittorrent web UI (published on gluetun)
      - "6881:6881"          # torrent port
      - "6881:6881/udp"
      - "5030:5030"          # slskd web UI (published on gluetun)
      - "5031:5031"          # slskd https
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"     # <-- all traffic routed through the VPN, kill-switched
    environment: { PUID: "1000", PGID: "1000", TZ: "America/Winnipeg", WEBUI_PORT: "8080" }
    volumes:
      - ./config/qbittorrent:/config
      - ./downloads:/downloads
    depends_on:
      - gluetun
    restart: unless-stopped

  # slskd shares gluetun's netns -> all Soulseek traffic exits via Mullvad (kill-switched).
  # NOTE: Mullvad has no port forwarding, so slskd cannot accept INCOMING peer connections;
  # downloads work (outbound), uploads only reach peers that have open ports.
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: "service:gluetun"     # <-- Soulseek traffic routed through the VPN
    user: "1000:1000"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_UMASK=0022
    volumes:
      - /home/ayub/soulseek/slskd-config:/app
      - /home/ayub/soulseek/downloads:/downloads
    depends_on:
      - gluetun
    restart: unless-stopped

  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    user: "1000:1000"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Winnipeg
      - SCRIPT_INTERVAL=300
      - WEBUI_ENABLED=true
    ports:
      - "8265:8265"           # Soularr UI
    volumes:
      - /home/ayub/soulseek/downloads:/downloads
      - /home/ayub/soulseek/soularr-config:/data
    depends_on:
      - slskd
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: { PUID: "1000", PGID: "1000", TZ: "America/Winnipeg" }
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment: { PUID: "1000", PGID: "1000", TZ: "America/Winnipeg" }
    volumes:
      - ./config/lidarr:/config
      - ./library:/music        # Lidarr root folder = staging (shipped + flushed)
      - ./downloads:/downloads  # must match qBittorrent's path
      - /home/ayub/soulseek/downloads:/slskd  # slskd's completed downloads (soularr imports from here)
    ports:
      - "8686:8686"
    restart: unless-stopped
