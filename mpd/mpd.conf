# transformer-mini-slab — user mpd, output via PipeWire (PulseAudio API)
music_directory     "~/Music"
playlist_directory  "~/.config/mpd/playlists"
db_file             "~/.config/mpd/database"
state_file          "~/.config/mpd/state"
sticker_file        "~/.config/mpd/sticker.sql"
log_file            "syslog"

bind_to_address     "127.0.0.1"
port                "6600"
restore_paused      "yes"
auto_update         "yes"
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"

# Reliable everywhere (pipewire-pulse provides the PulseAudio API):
audio_output {
    type "pulse"
    name "PipeWire (PulseAudio)"
}

# Lower-overhead native PipeWire output — switch to this if your mpd build
# includes the pipewire plugin (comment out the pulse block above):
#audio_output {
#    type "pipewire"
#    name "PipeWire"
#}
